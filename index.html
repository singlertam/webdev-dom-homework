<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul id="list" class="comments">
      </ul>
      <div class="add-form">
        <input
          id="name-input"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          value=""
        />
        <textarea
          id="comment-input"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button id="add-button" class="add-form-button">Написать</button>
          <button id="delete-button"class="delete-form-button">Удалить комментарий</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const buttonElement = document.getElementById('add-button');
    const deleteElement = document.getElementById('delete-button');
    const listElement = document.getElementById('list');
    const nameInputElement = document.getElementById('name-input');
    const commentInputElement = document.getElementById('comment-input');

    const likesCount = document.querySelectorAll('.likes-counter');

    const comments = [
      {
        name: 'Глеб Фокин',
        date: '12.02.22 12:18',
        text: 'Это будет первый комментарий на этой странице',
        likesCount: 3,
        isLiked: false
      },

      {
        name: 'Варвара Н.',
        date: '13.02.22 19:22',
        text: 'Мне нравится как оформлена эта страница! ❤',
        likesCount: 75,
        isLiked: false
      }
    ]

    function renderComments () {
      const commentsList = comments.map((comment, index) => {
        return `<li class="comment">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span data-type="isLiked" class="likes-counter">${comment.likesCount}</span>
              <button data-index="${index}" class="like-button ${comment.isLiked ? "-active-like" : ""}"></button>
            </div>
          </div>
        </li>`
      })
      listElement.innerHTML = commentsList.join('');
      addLike();
    }

    renderComments();

    commentInputElement.addEventListener('keyup', () => {
      if (event.key === 'Enter') {
        buttonElement.click(); 
      }
    });

    buttonElement.addEventListener('click', () => {
      buttonElement.classList.remove("error"); 

      if(nameInputElement.value.trim() === '' || commentInputElement.value.trim() === '') {
        buttonElement.classList.add("error");  
        return;
      } 

      const now = new Date();
      const year = now.getFullYear().toString().slice(-2); 
      const month = (now.getMonth() + 1).toString().padStart(2, '0'); 
      const day = now.getDate().toString().padStart(2, '0'); 
      const hours = now.getHours().toString().padStart(2, '0'); 
      const minutes = now.getMinutes().toString().padStart(2, '0');

      const fullDate = `${day}.${month}.${year} ${hours}:${minutes}`;
      
      const newComment = {
        name: nameInputElement.value.replaceAll('<', '&lt;').replaceAll('>', '&gt;'),
        date: fullDate,
        text: commentInputElement.value.replaceAll('<', '&lt;').replaceAll('>', '&gt;'),
        likesCount: 0,
        isLiked: false
      }

      comments.push(newComment); 
      renderComments();
      nameInputElement.value = "";
      commentInputElement.value = "";
    });

    nameInputElement.addEventListener('input', () => {
      if(nameInputElement.value.trim() !== '') {
        buttonElement.classList.remove("error");
      }
    });

    commentInputElement.addEventListener('input', () => {
      if(commentInputElement.value.trim() !== '') {
        buttonElement.classList.remove("error");
      }
    });

    function addLike () {
      const likeButtonsElements = document.querySelectorAll('.like-button');

      for (const likeButtonElement of likeButtonsElements) {
        const index = likeButtonElement.dataset.index;
        likeButtonElement.addEventListener('click', () => {
          if(!comments[index].isLiked) {
            comments[index].isLiked = true;
            comments[index].likesCount++;
            likeButtonElement.classList.add("-active-like");
          } else {
            comments[index].isLiked = false;
            comments[index].likesCount--;
          }
          renderComments();
        })   
      }
    }

    // const commentElements = document.querySelectorAll('.comment');
    //   commentElements.forEach((commentElement, index) => {
    //     commentElement.addEventListener('click', (event) => {
    //       event.stopPropagation();
    //       const selectedComment = comments[index]; 
    //       commentInputElement.value = selectedComment.text + '\n' + selectedComment.name;
    //     });
    // });

    // const commentElements = document.querySelectorAll('.comment');
    // commentElements.forEach((commentElement, index) => {
    //   commentElement.addEventListener('click', (event) => {
    //     event.stopPropagation();
    //     const selectedComment = comments[index]; 
    //     commentInputElement.value = `${selectedComment.text}\n${selectedComment.name}`;
    //   });
    // });

    const commentElements = document.querySelectorAll('.comment');
    function replyToComment() {
      commentElements.forEach((commentElement, index) => {
      commentElement.addEventListener('click', (event) => {
        event.stopPropagation();
        const selectedComment = comments[index]; 
        commentInputElement.value = `${selectedComment.text}\n${selectedComment.name}`;
      });
      });
    }

    replyToComment();

    deleteElement.addEventListener('click', () => {
      const commentsList = listElement.innerHTML;
      const lastCommentIndex = commentsList.lastIndexOf('<li class="comment">');
      if (lastCommentIndex !== -1) {
        listElement.innerHTML = commentsList.substring(0, lastCommentIndex);
      }
    });

  </script>
</html>
