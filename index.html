<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul id="list" class="comments"></ul>
      <div class="add-form">
        <input
          id="name-input"
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
          value=""
        />
        <textarea
          id="comment-input"
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button id="add-button" class="add-form-button">Написать</button>
          <button id="delete-button" class="delete-form-button">
            Удалить комментарий
          </button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";
    const buttonElement = document.getElementById("add-button");
    const deleteElement = document.getElementById("delete-button");
    const listElement = document.getElementById("list");
    const nameInputElement = document.getElementById("name-input");
    const commentInputElement = document.getElementById("comment-input");

    let comments = [];

    function renderComments() {
      const commentsList = comments.map((comment, index) => {
        return `<li class="comment">
          <div class="comment-header">
            <div>${comment.name}</div>
            <div>${comment.date}</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              ${comment.text}
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">${comment.likesCount}</span>
              <button data-index="${index}" class="like-button ${
          comment.isLiked ? "-active-like" : ""
        }"></button>
            </div>
          </div>
        </li>`;
      });
      listElement.innerHTML = commentsList.join("");
      addLike();
      replyToComment();
    }

    function fetchComments() {
      fetch("https://wedev-api.sky.pro/api/v1/magomed-alarkhanov/comments")
        .then((response) => response.json())
        .then((responseData) => {
          comments = responseData.comments.map((comment) => ({
            name: comment.author.name,
            date: comment.date,
            text: comment.text,
            likesCount: comment.likes,
            isLiked: false,
          }));
          renderComments();
        })
        .catch((error) => console.error(error));
    }

    fetchComments();

    buttonElement.addEventListener("click", () => {
      if (
        nameInputElement.value.trim() === "" ||
        commentInputElement.value.trim() === ""
      ) {
        buttonElement.classList.add("error");
        return;
      }

      function formatDate(date) {
        const day = String(date.getDate()).padStart(2, "0");
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const year = String(date.getFullYear()).slice(-2);
        const hours = String(date.getHours()).padStart(2, "0");
        const minutes = String(date.getMinutes()).padStart(2, "0");
        const seconds = String(date.getSeconds()).padStart(2, "0");

        return `${day}.${month}.${year} ${hours}:${minutes}:${seconds}`;
      }

      const currentDate = new Date();
      const formattedDate = formatDate(currentDate);

      const newComment = {
        name: nameInputElement.value
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;"),
        date: formattedDate,
        text: commentInputElement.value
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;"),
        likesCount: 0,
        isLiked: false,
      };

      comments.push(newComment);

      fetch("https://wedev-api.sky.pro/api/v1/magomed-alarkhanov/comments", {
        method: "POST",
        body: JSON.stringify({
          name: newComment.name,
          text: newComment.text,
        }),
      })
        .then((response) => response.json())
        .then((responseData) => {
          console.log(responseData);
        })
        .catch((error) => console.error(error));

      nameInputElement.value = "";
      commentInputElement.value = "";
    });

    nameInputElement.addEventListener("input", () => {
      if (nameInputElement.value.trim() !== "") {
        buttonElement.classList.remove("error");
      }
    });

    commentInputElement.addEventListener("input", () => {
      if (commentInputElement.value.trim() !== "") {
        buttonElement.classList.remove("error");
      }
    });

    function addLike() {
      const likeButtonsElements = document.querySelectorAll(".like-button");

      likeButtonsElements.forEach((likeButtonElement) => {
        likeButtonElement.addEventListener("click", (event) => {
          event.stopPropagation();
          const index = parseInt(likeButtonElement.dataset.index);
          if (!comments[index].isLiked) {
            comments[index].isLiked = true;
            comments[index].likesCount++;
          } else {
            comments[index].isLiked = false;
            comments[index].likesCount--;
          }
          renderComments();
        });
      });
    }

    function replyToComment() {
      const commentElements = document.querySelectorAll(".comment");
      commentElements.forEach((commentElement, index) => {
        commentElement.addEventListener("click", (event) => {
          event.stopPropagation();
          const selectedComment = comments[index];
          commentInputElement.value = `${selectedComment.text}\n${selectedComment.name}`;
        });
      });
    }

    deleteElement.addEventListener("click", () => {
      const lastCommentElement = listElement.querySelector(
        "li.comment:last-child"
      );
      if (lastCommentElement) {
        listElement.removeChild(lastCommentElement);
      }
    });
  </script>
</html>
